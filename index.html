<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador Multimarca</title>
</head>
<body>

    <h1>VISUALIZADOR MULTIMARCA</h1>

    <!-- Controles para cambiar entre piso y pared (llama a setModo) -->
    <div>
        <button onclick="setModo('piso')">Modo Piso</button>
        <button onclick="setModo('pared')">Modo Pared</button>
    </div>

    <h2>Catálogo</h2>
    
    <!-- Contenedor donde JavaScript dibujará los productos -->
    <div id="contenedor-productos" style="display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; max-height: 300px; overflow-y: auto;"></div>

    <h2>Escenario</h2>
    <!-- Contenedor de los Canvas para ver la textura aplicada -->
    <div style="position: relative; width: 600px; height: 400px; border: 2px solid #333;">
        <canvas id="floor-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></canvas>
        <canvas id="wall-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
    </div>

    <!-- Enlaza tu archivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
