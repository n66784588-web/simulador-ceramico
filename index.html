<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Virtual Multimarca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="app-header">
        <div class="logo">VISUALIZADOR MULTIMARCA</div>
        <div class="filters-top">
            <select id="brand-filter" onchange="filtrarCatalogo()">
                <option value="all">Todas las Marcas</option>
                <option value="porcelanite">Porcelanite</option>
                <option value="daltile">Daltile</option>
                <option value="vitromex">Vitromex</option>
                <option value="interceramic">Interceramic</option>
            </select>
            <select id="type-filter" onchange="filtrarCatalogo()">
                <option value="all">Todos los Productos</option>
                <option value="piso">Pisos</option>
                <option value="muro">Muros / Azulejos</option>
            </select>
        </div>
    </header>

    <!-- CONTENEDOR GENERAL -->
    <div class="main-container">
        
        <!-- CATÁLOGO LATERAL IZQUIERDO -->
        <aside class="sidebar-catalog">
            <h3>Catálogo</h3>
            <div class="product-grid" id="product-grid">
                <!-- Se inyecta dinámicamente con JS -->
            </div>
        </aside>

        <!-- VISUALIZADOR CENTRAL DE ESCENARIOS -->
        <main class="scene-container">
            <div class="canvas-viewport" id="scene-viewport">
                <div class="room-overlay-info" id="current-room-title">Escenario: Sala</div>
            </div>

            <!-- BOTONES DE NAVEGACIÓN ENTRE ESCENARIOS -->
            <nav class="room-nav">
                <button onclick="cambiarEscenario('fachada')">Fachada</button>
                <button onclick="cambiarEscenario('sala')" class="active">Sala</button>
                <button onclick="cambiarEscenario('recamara')">Recámara</button>
                <button onclick="cambiarEscenario('cocina')">Cocina</button>
                <button onclick="cambiarEscenario('bano')">Baño</button>
                <button onclick="cambiarEscenario('terraza')">Terraza</button>
            </nav>
        </main>

        <!-- PANEL LATERAL DERECHO (PRODUCTOS APLICADOS) -->
        <aside class="sidebar-applied">
            <h3>Productos Aplicados</h3>
            <div class="applied-box">
                <p><strong>Espacio actual:</strong> <span id="app-room-name">Sala</span></p>
                <hr style="border-color: #444; margin: 10px 0;">
                <p><strong>Piso Aplicado:</strong></p>
                <div id="applied-piso-info" class="applied-item">Ninguno seleccionado</div>
                
                <p style="margin-top: 15px;"><strong>Muro Aplicado:</strong></p>
                <div id="applied-muro-info" class="applied-item">Ninguno seleccionado</div>
            </div>
        </aside>

    </div>

    <script src="app.js"></script>
</body>
</html>
